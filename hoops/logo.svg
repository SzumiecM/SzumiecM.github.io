  <path d="M15 13 L17 21 L19 13 M18 13 L20 21 L22 13 M21 13 L23 21 L25 13 M17 21 L20 24 L23 21" stroke="#e2e8f0" stroke-width="0.8" fill="none" opacity="0.75" />
