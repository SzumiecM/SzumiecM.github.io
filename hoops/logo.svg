  <circle cx="11" cy="9" r="6" fill="url(#ballGrad)" />
  <!-- Basketball Seams -->
  <path d="M5 9 Q11 9 17 9" stroke="#7c2d12" stroke-width="0.8" fill="none" />
  <path d="M11 3 Q11 9 11 15" stroke="#7c2d12" stroke-width="0.8" fill="none" />
  <path d="M7 4.5 Q10 9 7 13.5" stroke="#7c2d12" stroke-width="0.7" fill="none" />
  <path d="M15 4.5 Q12 9 15 13.5" stroke="#7c2d12" stroke-width="0.7" fill="none" />
  <!-- Ball highlight -->
