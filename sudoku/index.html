<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sudoku — Pure Logic Engine</title>
  <meta name="description" content="Offline, zero-dependency client-side Sudoku puzzle generator with guaranteed solvability and uniqueness.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'none';
    form-action 'none';
    media-src 'none';
    object-src 'none';
    base-uri 'none';
  ">
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg-canvas">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="app-container">

    <header>
      <a href="../" class="brand" aria-label="Home">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
            <circle cx="9" cy="9" r="1.5" fill="#6366f1"></circle>
            <circle cx="15" cy="15" r="1.5" fill="#818cf8"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Sudoku</h1>
          <span>Pure Logic</span>
        </div>
      </a>

      <div class="header-actions">
        <div class="timer-box" aria-label="Timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="timer-text">00:00</span>
        </div>

        <button id="btn-reset" class="action-text-btn btn-reset" aria-label="Reset Puzzle" title="Reset puzzle to original state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Reset</span>
        </button>

        <button id="btn-new-game" class="action-text-btn" aria-label="New Game" title="Generate a new puzzle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span class="btn-text-full">New Game</span>
          <span class="btn-text-short">New</span>
        </button>
      </div>
    </header>

    <!-- Difficulty Selector -->
    <div class="difficulty-bar" role="tablist" aria-label="Difficulty Levels">
      <button class="diff-btn" data-diff="easy" role="tab">Easy</button>
      <button class="diff-btn active" data-diff="medium" role="tab">Medium</button>
      <button class="diff-btn" data-diff="hard" role="tab">Hard</button>
      <button class="diff-btn" data-diff="expert" role="tab">Expert</button>
    </div>

    <!-- Assist / Guide Mode Bar (Centered in middle screen, spacious touch targets) -->
    <div class="assist-bar">
      <div class="assist-segmented-wrap" id="assist-control" data-level="2" role="radiogroup" aria-label="Highlight and assist mode">
        <button type="button" class="assist-seg-btn" data-level="0" role="radio" aria-checked="false" aria-label="Level 0: Clean">
          <span class="seg-num">0</span>
          <span class="seg-label">Clean</span>
        </button>
        <button type="button" class="assist-seg-btn" data-level="1" role="radio" aria-checked="false" aria-label="Level 1: Warn">
          <span class="seg-num">1</span>
          <span class="seg-label">Warn</span>
        </button>
        <button type="button" class="assist-seg-btn active" data-level="2" role="radio" aria-checked="true" aria-label="Level 2: Guide">
          <span class="seg-num">2</span>
          <span class="seg-label">Guide</span>
        </button>

        <div class="assist-bubble" id="assist-bubble" role="tooltip" aria-live="polite">
          <div class="bubble-title" id="bubble-title">Level 2: Full Guide</div>
          <div class="bubble-desc" id="bubble-desc">Same-number & row/col highlights + collision warnings</div>
        </div>
      </div>
    </div>

    <!-- 9x9 Sudoku Board Grid -->
    <div class="board-wrapper">
      <div id="sudoku-grid" class="sudoku-grid" role="grid" aria-label="Sudoku Grid"></div>
    </div>

    <!-- Action Tools Bar -->
    <div class="action-bar">
      <button id="btn-undo" class="tool-btn" aria-label="Undo move">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
        <span>Undo</span>
        <span class="key-hint">Ctrl+Z</span>
      </button>

      <button id="btn-erase" class="tool-btn" aria-label="Erase cell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
        </svg>
        <span>Erase</span>
        <span class="key-hint">Del</span>
      </button>

      <button id="btn-pencil" class="tool-btn" aria-label="Toggle notes mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>Notes</span>
        <span class="key-hint">N</span>
      </button>
    </div>

    <!-- Number Keypad (1 - 9) -->
    <div class="keypad" role="group" aria-label="Number Keypad">
      <button class="num-btn" data-num="1"><span class="num-digit">1</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="2"><span class="num-digit">2</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="3"><span class="num-digit">3</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="4"><span class="num-digit">4</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="5"><span class="num-digit">5</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="6"><span class="num-digit">6</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="7"><span class="num-digit">7</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="8"><span class="num-digit">8</span><span class="count-badge"></span></button>
      <button class="num-btn" data-num="9"><span class="num-digit">9</span><span class="count-badge"></span></button>
    </div>

    <!-- Desktop Subtle Shortcuts Hint (Greyed out in background, strictly for PC) -->
    <div class="shortcuts-hint" aria-label="Keyboard Shortcuts">
      <span class="hint-group"><kbd>Ctrl</kbd> + <kbd>↑↓←→</kbd> <span class="hint-label">Jump 3×3</span></span>
      <span class="hint-dot">•</span>
      <span class="hint-group"><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>↑↓←→</kbd> <span class="hint-label">Jump to edge</span></span>
      <span class="hint-dot">•</span>
      <span class="hint-group"><kbd>Ctrl</kbd> + <kbd>Z</kbd> / <kbd>Y</kbd> <span class="hint-label">Undo / Redo</span></span>
    </div>

  </div>

  <!-- Rotary Dial Touch & Hold Selector (Stationary Phone Style) -->
  <div id="rotary-overlay" class="rotary-overlay" aria-hidden="true">
    <div id="rotary-wheel" class="rotary-wheel">
      <div id="rotary-center" class="rotary-center" title="Erase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
      <div class="rotary-item" data-num="1">1</div>
      <div class="rotary-item" data-num="2">2</div>
      <div class="rotary-item" data-num="3">3</div>
      <div class="rotary-item" data-num="4">4</div>
      <div class="rotary-item" data-num="5">5</div>
      <div class="rotary-item" data-num="6">6</div>
      <div class="rotary-item" data-num="7">7</div>
      <div class="rotary-item" data-num="8">8</div>
      <div class="rotary-item" data-num="9">9</div>
    </div>
  </div>

  <!-- Victory Celebration Modal -->
  <div id="victory-modal" class="victory-modal" role="dialog" aria-modal="true" aria-labelledby="victory-heading">
    <div class="victory-card">
      <div class="victory-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h2 id="victory-heading" class="victory-title">Puzzle Solved!</h2>
      <p class="victory-stats">Difficulty: <span id="victory-diff">Medium</span> · Time: <span id="victory-time">00:00</span></p>
      <button id="btn-play-again" class="victory-btn">Play Another</button>
    </div>
  </div>

  <!-- Zero-dependency Local Scripts -->
  <script src="algo.js"></script>
  <script src="app.js"></script>
</body>

</html>
