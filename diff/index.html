<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon"
        href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik04IDE3bC01LTUgNS01IiBzdHJva2U9IiNmODUxNDkiLz48cGF0aCBkPSJNMTYgN2w1IDUtNSA1IiBzdHJva2U9IiMzZmI5NTAiLz48cGF0aCBkPSJNMTIgM3YxOCIgc3Ryb2tlPSIjMzAzNjNkIiBzdHJva2UtZGFzaGFycmF5PSIyIDIiLz48L3N2Zz4=">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Diff tool</h1>

        <div id="diff-stats" class="diff-stats" style="display: none;">
            <span class="stat-count count-added" id="stat-added-txt">+0</span>
            <div class="stat-bar">
                <div id="bar-added" class="bar-fill fill-added"></div>
                <div id="bar-removed" class="bar-fill fill-removed"></div>
            </div>
            <span class="stat-count count-removed" id="stat-removed-txt">-0</span>
        </div>

        <button id="compare-btn">Check Diff</button>
    </header>

    <main class="container">
        <div class="panel">
            <div class="panel-header">Left</div>
            <div class="editor-wrapper">
                <textarea id="input-left" placeholder="Paste your original code or raw text here..."></textarea>
                <div id="output-left" class="diff-output"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Right</div>
            <div class="editor-wrapper">
                <textarea id="input-right" placeholder="Paste your modified code or raw text here..."></textarea>
                <div id="output-right" class="diff-output"></div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
