<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Radio</title>
    
    <meta name="referrer" content="no-referrer">
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://unpkg.com;
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https://de1.api.radio-browser.info;
        img-src 'self' data: *;
        media-src *;
    ">

    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiMwZDk0ODgiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNC45IDE5LjFDMSAxNy40IDEgMTMuNSAxIDEzLjVWNmEyIDIgMCAwIDEgMi0yaDE4YTIgMiAwIDAgMSAyIDJ2Ny41YzAgMy44IDAgNy43LTMuOSA5LjQiLz48cGF0aCBkPSJNMTIgMTF2NiIvPjxwYXRoIGQ9Ik0yIDExaDIwIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMiIvPjwvc3ZnPg==">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo">
                <i data-lucide="radio"></i>
                <div class="logo-text">
                    <h1>Flux Radio</h1>
                    <span>LIVE STREAM</span>
                </div>
            </div>
            <div class="controls">
                <button id="view-toggle" title="Toggle Favorites"><i data-lucide="heart"></i></button>
                <button id="tech-toggle" title="Toggle Tech Details"><i data-lucide="info"></i> Info</button>
                </div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search stations (e.g. BBC, Jazz, Techno)...">
            <button id="search-btn">Find</button>
        </div>

        <div class="tags">
            <button data-search="" data-type="top">Global Top 50 🔥</button>
            <span class="divider"></span>
            <button data-search="PL" data-type="countrycode">🇵🇱 Poland</button>
            <button data-search="US" data-type="countrycode">🇺🇸 USA</button>
            <button data-search="GB" data-type="countrycode">🇬🇧 UK</button>
            <span class="divider"></span>
            <button data-search="lofi" data-type="tag">LoFi</button>
            <button data-search="news" data-type="tag">News</button>
            <button data-search="jazz" data-type="tag">Jazz</button>
            <button data-search="rock" data-type="tag">Rock</button>
        </div>
    </header>

    <main id="station-grid">
        <div class="status-msg">Select a tag or search to begin...</div>
    </main>

    <div id="player-bar" class="hidden">
        <div class="player-info">
            <img id="player-img" src="" alt="Station Logo">
            <div class="player-text">
                <h3 id="player-title">Station Name</h3>
                <p id="player-meta">Connecting...</p>
            </div>
        </div>

        <div class="player-controls">
            <button id="play-pause-btn"><i data-lucide="play"></i></button>
        </div>

        <div class="player-volume">
            <i data-lucide="volume-2" id="vol-icon"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
