<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flux Radio</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline'; 
        connect-src 'self' https://*.api.radio-browser.info;
        img-src 'self' data: https:; 
        media-src *;
        object-src 'none';
        base-uri 'none';
        form-action 'none';
    ">
    <link rel="icon"
        href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjMGQ5NDg4IiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiPjxyZWN0IHg9IjIiIHk9IjciIHdpZHRoPSIyMCIgaGVpZ2h0PSIxMyIgcng9IjIiIHJ5PSIyIi8+PHBhdGggZD0iTTE2IDJ2NSIvPjxjaXJjbGUgY3g9IjEyIiBjeT0iMTMiIHI9IjMiLz48cGF0aCBkPSJNNiAxM3YuMDEiLz48cGF0aCBkPSJNMTggMTN2LjAxIi8+PC9zdmc+">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="top-bar">
            <div class="logo">
                <div class="logo-text">
                    <h1>Flux Radio</h1>
                    <span>LIVE STREAM</span>
                </div>
            </div>
            <div class="controls">
                <button id="icons-toggle" title="Load station logos">Icons</button>
                <button id="https-toggle" title="Only show secure HTTPS stations">HTTPS</button>
                <button id="anon-toggle" title="Strip Cookies/Credentials">Anon</button>

                <span class="divider" style="height: 15px; margin: 0 5px;"></span>

                <button id="view-toggle" title="Toggle Favorites">Favs</button>
                <button id="tech-toggle" title="Toggle Tech Details">Info</button>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search stations (e.g. BBC, Jazz, Techno)...">
            <button id="search-btn">Find</button>
        </div>

        <div class="tags">
            <button data-search="" data-type="top">Global Top 50 🔥</button>
            <span class="divider"></span>
            <button data-search="PL" data-type="countrycode">🇵🇱 Poland</button>
            <button data-search="US" data-type="countrycode">🇺🇸 USA</button>
            <button data-search="GB" data-type="countrycode">🇬🇧 UK</button>
            <span class="divider"></span>
            <button data-search="lofi" data-type="tag">LoFi</button>
            <button data-search="news" data-type="tag">News</button>
            <button data-search="jazz" data-type="tag">Jazz</button>
            <button data-search="rock" data-type="tag">Rock</button>
        </div>
    </header>

    <main id="station-grid">
        <div class="status-msg">Select a tag or search to begin...</div>
    </main>

    <div id="player-bar" class="hidden">
        <div class="player-info">
            <img id="player-img" src="" alt="Station Logo">
            <div class="player-text">
                <h3 id="player-title">Station Name</h3>
                <p id="player-meta">Connecting...</p>
            </div>
        </div>

        <div class="player-controls">
            <button id="play-pause-btn"></button>
        </div>

        <div class="player-volume">
            <div id="vol-icon-wrapper"></div>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.15">
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
